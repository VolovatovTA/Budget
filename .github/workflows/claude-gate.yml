# Shared gate for every Claude workflow: subscription token only (decision 0006), no runs on weekdays
# between 08:00 and 17:00 Europe/Belgrade (nights and weekends are free), and a clean skip when the
# token secret is not configured yet. The coder's sweep cron must land after 17:00 local in both DST
# states, hence 16:05 UTC.
name: Claude gate

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
    outputs:
      run:
        description: "true when Claude jobs may run"
        value: ${{ jobs.check.outputs.run }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Refuse to run if an API key is present anywhere in the environment
        run: |
          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::error::ANTHROPIC_API_KEY is set; Claude runs on the subscription token only (docs/decisions.md 0006)."
            exit 1
          fi
      - id: decide
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not configured; Claude jobs are skipped."
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          dow=$(TZ=Europe/Belgrade date +%u)
          hour=$(TZ=Europe/Belgrade date +%H)
          if [ "$dow" -le 5 ] && [ "$((10#$hour))" -ge 8 ] && [ "$((10#$hour))" -lt 17 ]; then
            echo "::notice::Working hours (Mon–Fri 08:00–17:00 Europe/Belgrade); Claude jobs wait for the evening sweep."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
