# The `reviewer` agent (.claude/agents/reviewer.md) comments on every same-repo pull request.
name: Claude review (reviewer)

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

jobs:
  gate:
    uses: ./.github/workflows/claude-gate.yml
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  review:
    needs: gate
    if: >-
      needs.gate.outputs.run == 'true' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-review-reviewer-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Read .claude/agents/reviewer.md and follow it exactly; it is your role. Review pull request
            #${{ github.event.pull_request.number }}: the diff is `git diff origin/${{ github.event.pull_request.base.ref }}...HEAD`.
            Write the report to $RUNNER_TEMP/review.md with the Write tool, then post it once with
            `gh pr comment ${{ github.event.pull_request.number }} --body-file $RUNNER_TEMP/review.md`. Start the report
            with the line "**reviewer review**". Do not edit repository files.
          claude_args: |
            --allowedTools "Read,Write,Glob,Grep,Bash(git diff *),Bash(git log *),Bash(git show *),Bash(git status*),Bash(gh pr view *),Bash(gh pr comment *)"
            --max-turns 20
