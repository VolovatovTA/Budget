name: Build

on:
  pull_request:
    # documentation and agent files do not need a build
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.claude/**'
      - '.github/workflows/claude-*.yml'
      - '.github/workflows/issue-guard.yml'
      - '.github/CODEOWNERS'

# One run per pull request at a time: a new push cancels the superseded run (goals.md: frugal with shared machines).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build with Gradle
        env:
          EXCHANGE_RATE_API_KEY: ${{ secrets.EXCHANGE_RATE_API_KEY }}
        run: ./gradlew :androidApp:assembleLocalMockDebug :androidApp:assembleRemoteBackDebug

      - name: Upload to GHA artifacts
        uses: actions/upload-artifact@v4
        with:
          path: androidApp/build/outputs/apk/localMock/debug
