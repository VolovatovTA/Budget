name: Build

on:
  push:
    branches:
      - '*'

env:
  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
  STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
#          если нужно перезаписать кэш не из default вуток
          cache-read-only: false
          cache-overwrite-existing: true
#          раскомментить для очистки кэша
#          gradle-home-cache-cleanup: true

      - name: Build with Gradle
        run: ./gradlew bundleRemoteBackRelease

      - name: Upload to GHA artifacts
        uses: actions/upload-artifact@v4
        with:
          path: app/build/outputs/bundle/remoteBackRelease

