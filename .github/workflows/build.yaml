name: Build

on:
  pull_request:
    branches: [master, develop]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew :androidApp:assembleLocalMockDebug :androidApp:assembleRemoteBackDebug

      - name: Upload to GHA artifacts
        uses: actions/upload-artifact@v4
        with:
          path: androidApp/build/outputs/apk/localMock/debug
