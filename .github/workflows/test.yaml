name: Tests

on:
  pull_request:
    branches: [master, develop]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :androidApp:testLocalMockDebugUnitTest :androidApp:testRemoteBackDebugUnitTest :core:network:testDebugUnitTest assertModuleGraph