name: Tests

on:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # the coverage comment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :androidApp:testLocalMockDebugUnitTest :androidApp:testRemoteBackDebugUnitTest :core:network:testDebugUnitTest :konsist:test assertModuleGraph

      # unit-test coverage of every module, merged; fails when it drops below COVERAGE_MIN_PERCENT (root build)
      - run: ./gradlew koverXmlReportCoverage koverVerifyCoverage

      - name: Coverage summary on the pull request
        uses: madrapps/jacoco-report@v1.7.1
        with:
          paths: build/reports/kover/reportCoverage.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Unit-test coverage
          update-comment: true
          min-coverage-overall: 12
          min-coverage-changed-files: 0