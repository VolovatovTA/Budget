name: Tests

on:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # the coverage comment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # koverXmlReportCoverage runs the localMock / debug unit tests of every module itself;
      # the remoteBack flavor, Konsist and the module graph are not part of the coverage variant
      - run: ./gradlew koverXmlReportCoverage koverVerifyCoverage :androidApp:testRemoteBackDebugUnitTest :konsist:test assertModuleGraph

      - name: Coverage summary on the pull request
        uses: madrapps/jacoco-report@v1.7.1
        with:
          paths: build/reports/kover/reportCoverage.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Unit-test coverage
          update-comment: true
          min-coverage-overall: 12
          min-coverage-changed-files: 50