# Both reviews of a same-repo pull request, in sequence: `reviewer` (.claude/agents/reviewer.md) first,
# `architect` (.claude/agents/architect.md) after it, so the architect's review is always the last one and
# is what starts a coder fix round (claude-coder.yml). The steps are in claude-review-role.yml.
name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

# A new push cancels the whole run, reviewer and architect alike: an architect review of a stale head
# would otherwise start a fix round against code that no longer exists.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/claude-gate.yml
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      AGENT_APP_ID: ${{ secrets.AGENT_APP_ID }}
      AGENT_APP_PRIVATE_KEY: ${{ secrets.AGENT_APP_PRIVATE_KEY }}

  reviewer:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    uses: ./.github/workflows/claude-review-role.yml
    with:
      role: reviewer
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      AGENT_APP_ID: ${{ secrets.AGENT_APP_ID }}
      AGENT_APP_PRIVATE_KEY: ${{ secrets.AGENT_APP_PRIVATE_KEY }}

  architect:
    needs: [gate, reviewer]
    # Runs after the reviewer whether that job succeeded or not; never when the gate said no or the run was
    # cancelled by a newer push.
    if: ${{ !cancelled() && needs.gate.outputs.run == 'true' }}
    uses: ./.github/workflows/claude-review-role.yml
    with:
      role: architect
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      AGENT_APP_ID: ${{ secrets.AGENT_APP_ID }}
      AGENT_APP_PRIVATE_KEY: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
