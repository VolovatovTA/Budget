[versions]
kotlin = "2.2.0"
ksp = "2.2.0-2.0.2"
kotlin-coroutines = "1.10.2"
compose-plugin = "1.9.0"
agp = "8.13.0"
min-sdk = "26"
compile-sdk = "36"
target-sdk = "36"
koin = "4.1.1"

androidTools = "31.13.0"
crashlyticV = "3.0.6"
gmsV = "4.4.3"

compose = "1.9.2"                      # версия Compose BOM / UI
activity-compose = "1.10.1"            # версия androidx.activity:activity-compose
androidx-navigation-compose = "2.9.3"  # версия Navigation Compose

core-ktx-version = "1.17.0"
activity-compose-version = "1.7.1"
viewmodel-compose-version = "2.9.3"
accompanist-systemui-controller-version = "0.27.1"
accompanist-version = "0.27.1"
compose-compiler-version = "1.3.0"

material-version = "1.7.8"
appcompat-version = "1.6.1"
constraintlayout-version = "2.1.4"

charts = "1.6.5"

junit-version = "4.13.2"
ext-junit-version = "1.1.5"
espresso-core-version = "3.5.1"
mockito = "5.2.0"
mockito-kotlin = "4.1.0"
