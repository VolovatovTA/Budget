kotlinTestVersion = "2.2.0"
runnerVersion = "1.5.2"
coreVersion = "1.5.0"
junit = "1.3.0"

firebase-bom = "34.3.0"
play-services-auth = "21.4.0"

[libraries]
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "compose" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-viewbinding = { module = "androidx.compose.ui:ui-viewbinding", version = "compose" }
compose-runtime = { module = "androidx.compose.runtime:runtime", version = "compose" }
compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose" }
compose-material = { module = "androidx.compose.material:material", version.ref = "compose" }
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core", version.ref = "material-version" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended", version.ref = "material-version" }
compose-activity = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
compose-navigation = { module = "androidx.navigation:navigation-compose", version.ref = "androidx-navigation-compose" }
compose-shimmer = { module = "com.valentinilk.shimmer:compose-shimmer", version = "1.3.3" }

charts-compose = { group = "com.patrykandpatrick.vico", name = "compose", version.ref = "charts" }
charts-compose-m3 = { group = "com.patrykandpatrick.vico", name = "compose-m3", version.ref = "charts" }

retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit-version" }
retrofit-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit-version" }
retrofit-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "interceptor-version" }

viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "viewmodel-compose-version" }
datastore-prefs = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore-prefs" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx-version" }

coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlin-coroutines" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlin-coroutines" }

kotlinx-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version = "1.9.0" }

room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiller = { module = "androidx.room:room-compiler", version.ref = "room" }

koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-test = { module = "io.insert-koin:koin-test", version.ref = "koin" }
koin-android-compose = { module = "io.insert-koin:koin-androidx-compose", version.ref = "koin" }

firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase-bom" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics" }
play-services-auth = { module = "com.google.android.gms:play-services-auth", version.ref = "play-services-auth" }

# Dependencies of the included build-logic
android-gradleApiPlugin = { group = "com.android.tools.build", name = "gradle-api", version.ref = "agp" }
android-tools-common = { group = "com.android.tools", name = "common", version.ref = "androidTools" }
compose-gradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
room-gradlePlugin = { group = "androidx.room", name = "room-gradle-plugin", version.ref = "room" }
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-stdlib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib", version.ref = "kotlinStdlibVersion" }
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlinTestVersion" }
runner = { group = "androidx.test", name = "runner", version.ref = "runnerVersion" }
core = { group = "androidx.test", name = "core", version.ref = "coreVersion" }
test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junit" }

[bundles]
compose = [
    "compose-ui",
    "compose-ui-tooling",
    "compose-foundation",
    "compose-material"
]
compose-icons = [
    "compose-material-icons-core",
    "compose-material-icons-extended"
]
charts = [
    "charts-compose",
    "charts-compose-m3"
]
retrofit = [
    "retrofit-gson",
    "retrofit"
]

[plugins]
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
gms = { id = "com.google.gms.google-services", version.ref = "gmsV" }
crashlitycs = { id = "com.google.firebase.crashlytics", version.ref = "crashlyticV" }

jetbrains-compose = { id = "org.jetbrains.compose", version.ref = "compose-plugin" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }

bysoft-library = { id = "ru.bysoft.library", version = "unspecified" }
bysoft-compose = { id = "ru.bysoft.compose", version = "unspecified" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
android-lint = { id = "com.android.lint", version.ref = "agp" }
ksp-compose = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room-android = { id = "androidx.room", version.ref = "room" }