// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext {

        min_sdk = 26
        compile_sdk = 33
        target_sdk = 33

        compose_version = '1.4.3'
        core_ktx_version = '1.9.0'
        nav_version = "2.5.3"
        activity_compose_version = '1.7.1'
        view_model_compose_version = '2.5.1'
        accompanist_systemui_controller_version = '0.27.1'
        accompanist_version = '0.27.1'
        compose_compiler_version = '1.3.0'

        material_version = '1.8.0'
        appcompat_version = '1.6.1'
        constraintlayout_version = '2.1.4'

        junit_version = '4.13.2'
        ext_junit_version = '1.1.5'
        espresso_core_version = '3.5.1'
        mockito = '5.2.0'
        mockito_kotlin = '4.1.0'
        coroutines_version = '1.5.2'

        paging_version = '3.1.1'

        retrofit_version = '2.9.0'
        hilt_version = '2.44'
        hilt_compiller_version = '1.0.0'
        interceptor_version = '4.10.0'
        splash_screen_version = '1.0.1'

        firebase_bom_version = '31.2.3'

        tehras_charts_version = '0.2.4-alpha'
    }
    dependencies {
        classpath 'com.google.gms:google-services:4.3.15'
    }
}

plugins {
    id 'com.android.application' version '7.4.1' apply false
    id 'com.android.library' version '7.4.1' apply false
    id 'org.jetbrains.kotlin.android' version '1.7.10' apply false
    id 'com.google.dagger.hilt.android' version '2.44' apply false

}

task clean(type: Delete) {
    delete rootProject.buildDir
}