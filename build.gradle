// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext {

        min_sdk = 23
        compile_sdk = 33
        target_sdk = 33

        compose_version = '1.3.1'
        core_ktx_version = '1.9.0'
        nav_version = "2.5.3"
        activity_compose_version = '1.6.1'
        view_model_compose_version = '2.5.1'
        accompanist_systemui_controller_version = '0.17.0'
        accompanist_version = '0.27.1'
        compose_compiler_version = '1.3.0'

        material_version = '1.7.0'
        appcompat_version = '1.5.1'
        constraintlayout_version = '2.1.4'

        junit_version = '4.13.2'
        ext_junit_version = '1.1.4'
        espresso_core_version = '3.5.0'
        paging_version = '3.1.1'

        retrofit_version = '2.9.0'
        hilt_version = '2.44'
        hilt_compiller_version = '1.0.0'
        interceptor_version = '4.10.0'
        splash_screen_version = '1.0.0'


    }
    repositories {
        google()
    }
}

plugins {
    id 'com.android.application' version '7.3.1' apply false
    id 'com.android.library' version '7.3.1' apply false
    id 'org.jetbrains.kotlin.android' version '1.7.10' apply false
    id 'com.google.dagger.hilt.android' version '2.44' apply false

}

task clean(type: Delete) {
    delete rootProject.buildDir
}