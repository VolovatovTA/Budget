plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'com.google.dagger.hilt.android'
    id 'com.google.gms.google-services'

}

android {
    signingConfigs {
        release {
            keyAlias 'uploadKey'
            keyPassword 'werthvfy926'
            storeFile file("${project.rootDir}/curvaMes.jks")
            storePassword 'werthvfy926'
        }
        debug {
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            storeFile file("${project.rootDir}/debug.keystore")
            storePassword 'android'
        }
    }
    compileSdk compile_sdk

    defaultConfig {
        applicationId "ru.it_bears.android.budget"
        minSdk min_sdk
        targetSdk target_sdk
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            multiDexEnabled true
        }
        debug {
            signingConfig signingConfigs.debug
            applicationIdSuffix ".debug"
            debuggable true
        }
    }
    // для объединения флаворов
    flavorDimensions "backType"
    productFlavors {
        remoteBack {
            dimension "backType"
            versionNameSuffix "-remoteBack"
        }
        localMock {
            dimension "backType"
            versionNameSuffix "-localMock"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    composeOptions {
        kotlinCompilerExtensionVersion compose_compiler_version
    }
    buildFeatures {
        compose true
    }
    kapt {
        correctErrorTypes true
    }
}

dependencies {

    implementation "androidx.core:core-ktx:$core_ktx_version"
    implementation "androidx.compose.ui:ui:$compose_version"
    implementation "androidx.compose.ui:ui-tooling:$compose_version"
    implementation "androidx.compose.foundation:foundation:$compose_version"
    implementation "androidx.compose.material:material:$compose_version"
    implementation "androidx.compose.material:material-icons-core:$compose_version"
    implementation "androidx.compose.material:material-icons-extended:$compose_version"
    implementation "androidx.activity:activity-compose:$activity_compose_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:$view_model_compose_version"
    implementation "com.google.accompanist:accompanist-systemuicontroller:$accompanist_systemui_controller_version"
    implementation "androidx.navigation:navigation-compose:$nav_version"
    implementation "androidx.compose.material:material:$compose_version"

    // retrofit
    implementation "com.squareup.retrofit2:retrofit:$retrofit_version"
    implementation "com.squareup.retrofit2:converter-gson:$retrofit_version"

    //hilt
    implementation "com.google.dagger:hilt-android:$hilt_version"
    kapt "com.google.dagger:hilt-compiler:$hilt_version"
    implementation "androidx.hilt:hilt-navigation-compose:$hilt_compiller_version"
    kapt "androidx.hilt:hilt-compiler:$hilt_compiller_version"
    annotationProcessor "androidx.hilt:hilt-compiler:$hilt_compiller_version"

    implementation "com.google.accompanist:accompanist-pager:$accompanist_version"
    implementation "com.google.accompanist:accompanist-pager-indicators:$accompanist_version"
    implementation "androidx.core:core-splashscreen:$splash_screen_version"
    implementation "com.squareup.okhttp3:logging-interceptor:$interceptor_version"

    implementation "androidx.compose.runtime:runtime-livedata:$compose_version"
    implementation "androidx.compose.runtime:runtime-rxjava2:$compose_version"
    implementation "androidx.appcompat:appcompat:$appcompat_version"
    implementation "com.google.android.material:material:$material_version"
    implementation "androidx.constraintlayout:constraintlayout:$constraintlayout_version"
    testImplementation "junit:junit:$junit_version"
    androidTestImplementation "androidx.test.ext:junit:$ext_junit_version"
    androidTestImplementation "androidx.test.espresso:espresso-core:$espresso_core_version"

    implementation platform("com.google.firebase:firebase-bom:$firebase_bom_version")
    implementation 'com.google.android.gms:play-services-auth:20.5.0'

    implementation "com.google.firebase:firebase-analytics-ktx"

    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"
    annotationProcessor "android.arch.persistence.room:compiler:1.1.1"
    kapt "androidx.room:room-compiler:$room_version"

    implementation project(':uikit')
    implementation project(':common')
    implementation project(':api')
    implementation project(':features:splash')
    implementation project(':features:auth')
    implementation project(':features:create-udate-category')
    implementation project(':features:create-update-delete-transactions')
    implementation project(':features:create-update-wallet')
    implementation project(':features:bottom-navigation:host')
    implementation project(':features:bottom-navigation:home')
    implementation project(':features:bottom-navigation:statistic')
    implementation project(':features:statistic-by-month')
    implementation project(':features:settings')
    implementation project(path: ':features:currency-rates')
}